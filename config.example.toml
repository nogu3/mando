# mando 設定サンプル。
#
# 実 config（実 IP・EPC = 設置環境のトポロジ）はリポジトリに含めない。
# これをコピーして config.toml を作り、実値を埋める:
#
#   cp config.example.toml config.toml
#
# 本体は各操作のコマンド配列をそのまま exec するだけ（バックエンド非依存）。
# enl → casa への移行はコード変更ではなく、この配列の差し替えで済む。

# mando が bind するアドレス。LAN なら LAN アドレス、外出先対応なら
# オーバーレイ網のアドレスに変えるだけ（ポート開放は不要）。
bind = "0.0.0.0:8080"

# デバイス exec の上限ミリ秒（省略時 15000）。超過は「応答なし」として UI に出る。
[exec]
timeout_ms = 15000

[[device]]
name      = "shutter"        # URL とフロントが使う安定識別子（変えると URL が変わる）
alias     = "シャッター"     # UI 表示名（任意。未指定なら name。`label` でも可）
# enl / casa 経由のデバイスは 3610 を専有 bind するため、同一レーンで直列化する。
# mat 等それ以外のバックエンドでは lane 不要（省略時はデバイス単位の直列のみ）。
lane      = "echonet"
# 実値（IP・open/close の hex・open_close_state の値域）は機種で振れる。
# 投入前に `enl describe <IP> 026301` で確認すること。電動シャッターは 0x0263。
# IP は RFC 5737 のドキュメント用レンジ（192.0.2.0/24）。実 IP に置き換える。
# casa 経由（推奨。名前解決は casa の devices.toml が持つ）。
# casa get は enl 出力を {"value": {...}} でラップするが、mando の正規化が
# 両対応なので下の enl 直の形にそのまま差し戻すこともできる。
get_state = ["casa", "get", "shutter", "open_close_state"]
open      = ["casa", "set", "shutter", "open_close_operation", "open"]
close     = ["casa", "set", "shutter", "open_close_operation", "close"]
# stop は任意。指定すると UI に「止める」ボタンが出る（途中停止）。未指定なら出ない。
stop      = ["casa", "set", "shutter", "open_close_operation", "stop"]

# enl を直接叩く形（casa を挟まない場合。正規化はこちらも受ける）:
#   get_state = ["enl", "get", "192.0.2.10", "026301", "open_close_state"]
#   open      = ["enl", "set", "192.0.2.10", "026301", "open_close_operation", "open"]
#   close     = ["enl", "set", "192.0.2.10", "026301", "open_close_operation", "close"]
#   stop      = ["enl", "set", "192.0.2.10", "026301", "open_close_operation", "stop"]

# 一括操作グループ（任意）。members の device をまとめて開閉/停止できる。
# UI 上部に一括ボタンが出る。全メンバーが stop 対応なら一括「止める」も出る。
# [[group]]
# name    = "all"
# alias   = "全部"
# members = ["shutter", "garage"]

# 複数デバイスは [[device]] を増やすだけ（API は既に対応済み）。
# [[device]]
# name      = "garage"
# label     = "ガレージ"
# lane      = "echonet"
# get_state = ["enl", "get", "192.0.2.11", "026301", "open_close_state"]
# open      = ["enl", "set", "192.0.2.11", "026301", "open_close_operation", "open"]
# close     = ["enl", "set", "192.0.2.11", "026301", "open_close_operation", "close"]

# ── Matter ライト（mat 直叩き）─────────────────────────
# kind = "light" は on / off / get_state 必須。色・色温度は [[device.preset]] に
# 完成済みコマンドを並べる（任意値入力は作らない）。color（CSS color 文字列）を
# 書くと UI が色玉スウォッチで出す。省略するとテキストチップになる。
# node 番号は `mat discover` で確認。将来 casa に差し替えるときも配列の差し替えのみ。
# [[device]]
# name  = "desk_light"
# alias = "デスクライト"
# kind  = "light"
# get_state = ["mat", "read", "--node", "5", "--cluster", "onoff", "--attribute", "on-off"]
# on    = ["mat", "on",  "--node", "5"]
# off   = ["mat", "off", "--node", "5"]
# 任意色スライダー用テンプレ（任意）。{color} が検証済み hex（例 "#ff69b4"）に
# 置換されて exec される。{color} は配列全体でちょうど 1 個。指定すると UI の
# 色選択シートに「すきな色」スライダーが出る（shutter には書けない）。
# color = ["mat", "color", "--node", "5", "--rgb", "{color}"]
# 明るさ（調光）スライダー用テンプレ（任意）。{brightness} が検証済みの整数 1〜100 に
# 置換されて exec される。{brightness} は配列全体でちょうど 1 個。指定すると UI の
# あかり調整シートに明るさスライダーが出る（shutter には書けない）。% → 機器生値の
# 変換が要る場合は mat 側で吸収する（mando は % のまま渡す）。
# brightness = ["mat", "level", "--node", "5", "--percent", "{brightness}"]
#
# [[device.preset]]
# name  = "warm"
# label = "電球色"
# color = "#ffd9a0"
# cmd   = ["mat", "color-temp", "--node", "5", "--kelvin", "2700"]
#
# [[device.preset]]
# name  = "daylight"
# label = "白色"
# color = "#f2f5ff"
# cmd   = ["mat", "color-temp", "--node", "5", "--kelvin", "5000"]
#
# [[device.preset]]
# name  = "pink"
# label = "ピンク"
# color = "#ff69b4"
# cmd   = ["mat", "color", "--node", "5", "--name", "pink"]
#
# 注意: light は [[group]]（シャッター用）には入れられない。light 同士をまとめるには
# 下の「light のグループカード（members）」を使う。
# 注意: light は定期ポーリングしない（mat 直叩きは 1 コール数秒 + exec 直列のため）。
#       表示時 1 回 + 操作の ~2 秒後に 1 回の追いつき取得のみ（ベストエフォート表示）。
#
# ── mat の wire group（groupcast）でまとめて操作する場合 ──────────────
# group は無応答マルチキャストで state を読めないため、get_state は代表ノード
# 1 台の on/off を読む。操作 POST は送信結果のみ返し、state は UI が ~2 秒後に
# 1 回だけ追いつき取得するので、確認読みを sh ラッパーで遅らせる必要はない。
# 応答を速くするには matd を常駐させる（mando の unit に MAT_MATD_SOCKET を
# 教える。matd 無しだと 1 コールごとに chip-tool 起動 + CASE 確立で数秒かかる）。
# get_state = ["mat", "read", "--node", "5", "--cluster", "onoff", "--attribute", "on-off"]
# on    = ["mat", "group", "invoke", "--group", "10", "--cluster", "onoff", "--command", "on"]
# off   = ["mat", "group", "invoke", "--group", "10", "--cluster", "onoff", "--command", "off"]
# （preset も同様に ["mat", "group", "color-temp", "--group", "10", "--kelvin", "2700"] 等）
# color = ["mat", "group", "color", "--group", "10", "--rgb", "{color}"]

# ── ECHONET on/off 機器（換気扇・on/off だけの照明・床暖房 on/off 等。enl/casa 経由）──
# kind = "switch" は on / off / get_state 必須。color・brightness・preset・open/close/stop は不可。
# get_state は電源状態（EPC 0x80）を読む。プロパティ名・値域は機種で振れるため、投入前に
# `casa describe <name>`（または `enl describe <IP> <EOJ>`）で get_map を確認する。
# 例: casa の照明は EPC 0x80 の名前が `power`（30=on/31=off）で、get 出力の value は
# {"power":"on"} 形。mando の正規化は state / open_close_state / power の各キーを受ける。
# set 後は mando が同期で state を取り直して確定表示する（shutter と同じ正直な確認）。
# [[device]]
# name  = "kitchen_light"
# alias = "キッチン照明"
# kind  = "switch"
# face = "light"  # 任意・switch 専用。指定すると 💡「照明」セクションに並び状態は「点灯/消灯」。
#                 # 未指定なら ⏻「スイッチ」セクション。換気扇・床暖房等は未指定のまま。
# lane  = "echonet"
# casa 経由（推奨。名前解決は casa の devices.toml が持つ。on/off は専用動詞が簡潔）:
# get_state = ["casa", "get", "kitchen_light", "power"]
# on        = ["casa", "on",  "kitchen_light"]
# off       = ["casa", "off", "kitchen_light"]
# enl を直接叩く形（casa を挟まない場合。正規化はこちらも受ける）:
#   get_state = ["enl", "get", "192.0.2.20", "029108", "operation_status"]
#   on        = ["enl", "set", "192.0.2.20", "029108", "operation_status", "on"]
#   off       = ["enl", "set", "192.0.2.20", "029108", "operation_status", "off"]
#
# 注意: switch はグループ（[[group]] members）に入れられない（当面シャッター専用）。

# ── light のグループカード（members）─────────────────────
# light デバイスは members を持つことで「グループカード」として表示される。
# 一括操作は上の group コマンド（wire group の場合は mat group invoke 等）のまま。
# members は UI の「個別に操作」展開に使われ、mando が members を順に exec することはない。
# メンバーは自分も [[device]] として定義されている必要がある。トップの照明一覧からは消え、
# グループカードの展開内にのみ表示される。親・メンバーとも light 限定・入れ子禁止・複数親への所属禁止。
# [[device]]
# name  = "living_lights"
# alias = "リビング照明"
# kind  = "light"
# get_state = ["mat", "read", "--node", "6", "--cluster", "onoff", "--attribute", "on-off"]
# on    = ["mat", "group", "invoke", "--group", "10", "--cluster", "onoff", "--command", "on"]
# off   = ["mat", "group", "invoke", "--group", "10", "--cluster", "onoff", "--command", "off"]
# brightness = ["mat", "group", "level", "--group", "10", "--percent", "{brightness}"]
# members = ["living_south_light", "tv_back_light"]
#
# [[device]]
# name  = "living_south_light"
# kind  = "light"
# get_state = ["mat", "read", "--node", "6", "--cluster", "onoff", "--attribute", "on-off"]
# on    = ["mat", "on",  "--node", "6"]
# off   = ["mat", "off", "--node", "6"]
#
# [[device]]
# name  = "tv_back_light"
# kind  = "light"
# get_state = ["mat", "read", "--node", "7", "--cluster", "onoff", "--attribute", "on-off"]
# on    = ["mat", "on",  "--node", "7"]
# off   = ["mat", "off", "--node", "7"]

# ── グラフ（きろくセクション）──────────────────────────────
# 下層の読み出しコマンドをテンプレで指定する。mando はこのコマンドを exec し
# stdout の契約 JSON 配列を受け取るだけで、transport（HTTP か CLI か）は知らない。
# {period} は today / week / month（検証済みの 3 値のみ）に置換される。
# コマンドは stdout に
#   [{"ts":"2026-07-15T10:00:00+09:00","series":"書斎","value":812.0}, ...]
# の JSON 配列を返すこと（series は単系列なら省略可）。SQL・スキーマ・データパスは
# embalse 側の責務。現状は NAS 常駐の embalse-query serve（:8526）を curl で叩く:
#   curl -fsS --max-time 30 <URL>
#   -f=HTTP≥400 で失敗（→ mando は 502）／-s=進捗抑制／-S=エラーは stderr へ
#   --max-time 30=契約の 30s 上限。ベース URL は下の各例に直書き（設置環境で書換）。
#
# [[graph]]
# name       = "generation"
# label      = "太陽光発電"
# unit       = "W"      # 今日ビュー（時系列カーブ）の単位
# unit_daily = "kWh"    # 週/月ビュー（日別集計）の単位。省略時 unit
# query      = ["curl", "-fsS", "--max-time", "30", "http://192.0.2.20:8526/api/graphs/generation?period={period}"]
#
# [[graph]]
# name  = "co2"
# label = "CO2"
# unit  = "ppm"
# query = ["curl", "-fsS", "--max-time", "30", "http://192.0.2.20:8526/api/graphs/co2?period={period}"]
#
# [[graph]]
# name  = "machine"
# label = "jarvis"
# unit  = "%"      # 温度だけ series_labels 側で ℃ を明示
# query = ["curl", "-fsS", "--max-time", "30", "http://192.0.2.20:8526/api/graphs/machine?period={period}"]
# [graph.series_labels]  # series 名 → UI 表示名（任意。無いキーは素通し）
# cpu_used_pct  = "CPU (%)"
# mem_used_pct  = "メモリ (%)"
# disk_used_pct = "ディスク (%)"
# cpu_temp_c    = "温度 (℃)"

# ── マシン健全性（任意）─────────────────────────────
# 下層の health 読み出しコマンドを exec し、異常時のみ画面上部にバナーを出す。
# 未設定ならこの機能ごと無効。しきい値判定は下層の責務。グラフ同様、現状は NAS 常駐の
# embalse-query serve（:8526）を curl で叩く（period なし）。
#
# [health]
# label   = "jarvis"                       # バナーの対象名（任意）
# command = ["curl", "-fsS", "--max-time", "30", "http://192.0.2.20:8526/api/health"]
# [health.labels]  # metric 名 → 表示名（任意。無いキーは素通し）
# cpu_used_pct  = "CPU"
# mem_used_pct  = "メモリ"
# disk_used_pct = "ディスク"
# cpu_temp_c    = "CPU温度"
