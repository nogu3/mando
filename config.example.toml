# mando 設定サンプル。
#
# 実 config（実 IP・EPC = 設置環境のトポロジ）はリポジトリに含めない。
# これをコピーして config.toml を作り、実値を埋める:
#
#   cp config.example.toml config.toml
#
# 本体は各操作のコマンド配列をそのまま exec するだけ（バックエンド非依存）。
# enl → casa への移行はコード変更ではなく、この配列の差し替えで済む。

# mando が bind するアドレス。LAN なら LAN アドレス、外出先対応なら
# オーバーレイ網のアドレスに変えるだけ（ポート開放は不要）。
bind = "0.0.0.0:8080"

[[device]]
name      = "shutter"        # URL とフロントが使う安定識別子（変えると URL が変わる）
alias     = "シャッター"     # UI 表示名（任意。未指定なら name。`label` でも可）
# 実値（IP・open/close の hex・open_close_state の値域）は機種で振れる。
# 投入前に `enl describe <IP> 026301` で確認すること。電動シャッターは 0x0263。
# IP は RFC 5737 のドキュメント用レンジ（192.0.2.0/24）。実 IP に置き換える。
get_state = ["enl", "get", "192.0.2.10", "026301", "open_close_state"]
open      = ["enl", "set", "192.0.2.10", "026301", "open_close_operation", "open"]
close     = ["enl", "set", "192.0.2.10", "026301", "open_close_operation", "close"]
# stop は任意。指定すると UI に「止める」ボタンが出る（途中停止）。未指定なら出ない。
stop      = ["enl", "set", "192.0.2.10", "026301", "open_close_operation", "stop"]

# 将来 casa に差し替える例（本体コードは変更しない）:
#   get_state = ["casa", "get", "shutter", "open_close_state"]
#   open      = ["casa", "set", "shutter", "open_close_operation", "open"]
#   close     = ["casa", "set", "shutter", "open_close_operation", "close"]

# 一括操作グループ（任意）。members の device をまとめて開閉/停止できる。
# UI 上部に一括ボタンが出る。全メンバーが stop 対応なら一括「止める」も出る。
# [[group]]
# name    = "all"
# alias   = "全部"
# members = ["shutter", "garage"]

# 複数デバイスは [[device]] を増やすだけ（API は既に対応済み）。
# [[device]]
# name      = "garage"
# label     = "ガレージ"
# get_state = ["enl", "get", "192.0.2.11", "026301", "open_close_state"]
# open      = ["enl", "set", "192.0.2.11", "026301", "open_close_operation", "open"]
# close     = ["enl", "set", "192.0.2.11", "026301", "open_close_operation", "close"]

# ── Matter ライト（mat 直叩き）─────────────────────────
# kind = "light" は on / off / get_state 必須。色・色温度は [[device.preset]] に
# 完成済みコマンドを並べる（UI にチップボタンが出る。任意値入力は作らない）。
# node 番号は `mat discover` で確認。将来 casa に差し替えるときも配列の差し替えのみ。
# [[device]]
# name  = "living_lights"
# alias = "リビング照明"
# kind  = "light"
# get_state = ["mat", "read", "--node", "5", "--cluster", "onoff", "--attribute", "on-off"]
# on    = ["mat", "on",  "--node", "5"]
# off   = ["mat", "off", "--node", "5"]
#
# [[device.preset]]
# name  = "warm"
# label = "電球色"
# cmd   = ["mat", "color-temp", "--node", "5", "--kelvin", "2700"]
#
# [[device.preset]]
# name  = "daylight"
# label = "白色"
# cmd   = ["mat", "color-temp", "--node", "5", "--kelvin", "5000"]
#
# [[device.preset]]
# name  = "pink"
# label = "ピンク"
# cmd   = ["mat", "color", "--node", "5", "--name", "pink"]
#
# 注意: light はグループ（[[group]] members）に入れられない（当面シャッター専用）。
# 注意: light は定期ポーリングしない（mat 直叩きは 1 コール数秒 + exec 直列のため）。
#       表示時 1 回 + 操作後の確定表示のみ。
