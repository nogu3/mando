<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>mando</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --line: #2a2f3a;
    --fg: #e8eaed;
    --muted: #9aa0ab;
    --open: #2e7d32;
    --closed: #b0480f;
    --unknown: #5a6170;
    --stop: #5a6170;
    --warn: #b3261e;
    --tap: 0.08s ease;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 18px 16px 8px; display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .04em; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { padding: 8px 12px 32px; max-width: 560px; margin: 0 auto; }

  .device {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px; margin: 12px 0;
  }
  .device .name { font-size: 18px; font-weight: 700; }

  .status {
    display: flex; align-items: center; gap: 10px;
    margin: 12px 0 16px; min-height: 28px;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--unknown); flex: none;
  }
  .status.open  .dot { background: var(--open); }
  .status.closed .dot { background: var(--closed); }
  .status .label { font-size: 17px; font-weight: 600; }
  .status .msg { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
  .status.error .msg { color: var(--warn); }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.act {
    appearance: none; border: none; border-radius: 14px;
    font-size: 20px; font-weight: 800; letter-spacing: .06em;
    /* 大きいタッチターゲット */
    min-height: 76px; color: #fff; cursor: pointer;
    transition: transform var(--tap), filter var(--tap), opacity var(--tap);
    touch-action: manipulation; user-select: none;
  }
  button.open  { background: var(--open); }
  button.close { background: var(--closed); }
  /* stop は全幅で開閉の下に。途中停止は補助操作なので一段下げる。 */
  button.stop  { grid-column: 1 / -1; background: var(--stop); min-height: 60px; }
  button.act:active:not(:disabled) { transform: scale(.97); filter: brightness(1.12); }
  button.act:disabled { opacity: .5; cursor: progress; }

  .busy { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; }
  .spin {
    display: inline-block; width: 11px; height: 11px; margin-right: 6px;
    border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%;
    animation: spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .boot { color: var(--muted); padding: 24px 4px; }
</style>
</head>
<body>
<header>
  <h1>mando</h1>
  <span class="sub">家のリモコン</span>
</header>
<main id="app">
  <div class="boot">読み込み中…</div>
</main>

<script>
"use strict";

// set コマンドの exec 結果 → UI メッセージ（設計原則 7）。
const ACTION_MSG = {
  success:       "",
  timeout:       "応答なし、もう一度",
  rejected:      "機器が拒否",
  network_error: "ネットワーク異常",
  failed:        "操作に失敗",
  spawn_failed:  "コマンド起動失敗",
};
// state 取得の exec 結果 → UI メッセージ。
const STATE_MSG = {
  success:       "",
  timeout:       "応答なし",
  rejected:      "機器が拒否",
  network_error: "ネットワーク異常",
  failed:        "取得失敗",
  spawn_failed:  "コマンド起動失敗",
};
const STATE_LABEL = { open: "開", closed: "閉", unknown: "不明" };

const POLL_MS = 4000; // 3〜5 秒ポーリング（状態は pull）。

const app = document.getElementById("app");
const cards = new Map(); // name -> { el, statusEl, dotState, labelEl, msgEl, busyEl, buttons }
let polling = false;

async function api(method, path) {
  const res = await fetch(path, { method, headers: { "accept": "application/json" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function buildCard(dev) {
  const el = document.createElement("div");
  el.className = "device";
  el.innerHTML = `
    <div class="name"></div>
    <div class="status unknown">
      <span class="dot"></span>
      <span class="label">不明</span>
      <span class="msg"></span>
    </div>
    <div class="controls">
      <button class="act open" data-op="open">開ける</button>
      <button class="act close" data-op="close">閉める</button>
    </div>
    <div class="busy"></div>
  `;
  el.querySelector(".name").textContent = dev.label;
  // stop 対応デバイスのみ停止ボタンを足す（API の stop フラグで判断）。
  if (dev.stop) {
    const stopBtn = document.createElement("button");
    stopBtn.className = "act stop";
    stopBtn.dataset.op = "stop";
    stopBtn.textContent = "止める";
    el.querySelector(".controls").appendChild(stopBtn);
  }
  const statusEl = el.querySelector(".status");
  const c = {
    el,
    statusEl,
    labelEl: el.querySelector(".status .label"),
    msgEl: el.querySelector(".status .msg"),
    busyEl: el.querySelector(".busy"),
    buttons: [...el.querySelectorAll("button.act")],
  };
  for (const btn of c.buttons) {
    btn.addEventListener("click", () => act(dev.name, btn.dataset.op));
  }
  cards.set(dev.name, c);
  return el;
}

function renderState(name, view) {
  const c = cards.get(name);
  if (!c) return;
  const st = view.state || "unknown";
  c.statusEl.className = "status " + st;
  c.labelEl.textContent = STATE_LABEL[st] || "不明";
  const m = STATE_MSG[view.exec] || "";
  c.msgEl.textContent = m;
  if (m) c.statusEl.classList.add("error");
}

function setBusy(name, busy, text) {
  const c = cards.get(name);
  if (!c) return;
  for (const b of c.buttons) b.disabled = busy;
  c.busyEl.innerHTML = busy
    ? `<span class="spin"></span>${text || ""}`
    : (text || "");
}

let busyCount = 0; // 操作中はポーリングを止め、3610 の取り合いを避ける。

async function act(name, op) {
  busyCount++;
  const verb = { open: "開けています…", close: "閉めています…", stop: "止めています…" }[op] || "実行中…";
  setBusy(name, true, verb);
  try {
    // set → 直後に state 再取得済みのレスポンスが返る（楽観表示しない）。
    const view = await api("POST", `/api/devices/${encodeURIComponent(name)}/${op}`);
    renderState(name, view);
    const am = ACTION_MSG[view.action] || "";
    setBusy(name, false, am ? "⚠ " + am : "");
  } catch (e) {
    setBusy(name, false, "⚠ 通信エラー");
  } finally {
    busyCount--;
  }
}

async function pollOnce() {
  if (busyCount > 0) return; // 操作中は触らない。
  for (const name of cards.keys()) {
    if (busyCount > 0) return;
    try {
      const view = await api("GET", `/api/devices/${encodeURIComponent(name)}/state`);
      renderState(name, view);
    } catch (e) {
      const c = cards.get(name);
      if (c) { c.msgEl.textContent = "接続なし"; c.statusEl.classList.add("error"); }
    }
  }
}

function startPolling() {
  if (polling) return;
  polling = true;
  const tick = async () => {
    await pollOnce();
    setTimeout(tick, POLL_MS);
  };
  tick();
}

async function boot() {
  let devices;
  try {
    devices = await api("GET", "/api/devices");
  } catch (e) {
    app.innerHTML = `<div class="boot">⚠ サーバに接続できません</div>`;
    return;
  }
  if (!devices.length) {
    app.innerHTML = `<div class="boot">config に device がありません</div>`;
    return;
  }
  app.innerHTML = "";
  for (const dev of devices) app.appendChild(buildCard(dev));
  startPolling();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) pollOnce(); // 復帰時 即更新。
});

boot();
</script>
</body>
</html>
