<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>mando</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel2: #20242d;
    --line: #2a2f3a;
    --fg: #e8eaed;
    --muted: #9aa0ab;
    --open: #2e7d32;
    --closed: #b0480f;
    --moving: #c9912a;
    --stopped: #3a6ea5;
    --unknown: #5a6170;
    --stop: #5a6170;
    --warn: #b3261e;
    --tap: 0.08s ease;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 14px 16px 4px; display: flex; align-items: baseline; gap: 10px;
  }
  header h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: .04em; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { padding: 6px 12px 28px; max-width: 560px; margin: 0 auto; }

  /* ── 一括グループバー（上部・sticky）──────────────── */
  .group {
    position: sticky; top: 6px; z-index: 5;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 14px; margin: 6px 0 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .group .ghead {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
  }
  .group .gname { font-size: 16px; font-weight: 700; }
  .group .gsum { color: var(--muted); font-size: 12px; margin-left: auto; }
  .group .gctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .group .gbusy { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 0; }
  .group .gbusy:not(:empty) { margin-top: 8px; }

  /* ── デバイス一覧（コンパクト・全件 1 画面）──────────── */
  .device {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 12px; margin: 8px 0;
  }
  .device .info { flex: 1; min-width: 0; }
  .device .name { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .status { display: flex; align-items: center; gap: 7px; margin-top: 4px; min-height: 18px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--unknown); flex: none; }
  .status.open    .dot { background: var(--open); }
  .status.closed  .dot { background: var(--closed); }
  .status.opening .dot,
  .status.closing .dot { background: var(--moving); animation: pulse 1s ease-in-out infinite; }
  .status.stopped .dot { background: var(--stopped); }
  @keyframes pulse { 50% { opacity: .35; } }
  .status .label { font-size: 13px; color: var(--muted); }
  .status .msg { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .status.error .msg { color: var(--warn); }

  .controls { display: flex; gap: 8px; flex: none; }
  button.act {
    appearance: none; border: none; border-radius: 12px;
    font-weight: 800; color: #fff; cursor: pointer;
    transition: transform var(--tap), filter var(--tap), opacity var(--tap);
    touch-action: manipulation; user-select: none;
  }
  /* デバイス個別: 短ラベルの中ターゲット */
  .controls button.act { width: 54px; min-height: 52px; font-size: 17px; letter-spacing: .04em; }
  /* 一括: 大ターゲット */
  .group .gctl button.act { min-height: 64px; font-size: 19px; letter-spacing: .06em; }
  .group .gctl button.stop { grid-column: 1 / -1; min-height: 48px; font-size: 16px; }
  button.open  { background: var(--open); }
  button.close { background: var(--closed); }
  button.stop  { background: var(--stop); }
  button.act:active:not(:disabled) { transform: scale(.96); filter: brightness(1.12); }
  button.act:disabled { opacity: .45; cursor: progress; }

  .spin {
    display: inline-block; width: 11px; height: 11px; margin-right: 6px;
    border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%;
    animation: spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .boot { color: var(--muted); padding: 24px 4px; }
</style>
</head>
<body>
<header>
  <h1>mando</h1>
  <span class="sub">家のリモコン</span>
</header>
<main id="app">
  <div class="boot">読み込み中…</div>
</main>

<script>
"use strict";

// set コマンドの exec 結果 → UI メッセージ（設計原則 7）。
const ACTION_MSG = {
  success: "", timeout: "応答なし、もう一度", rejected: "機器が拒否",
  network_error: "ネットワーク異常", failed: "操作に失敗", spawn_failed: "コマンド起動失敗",
};
// state 取得の exec 結果 → UI メッセージ。
const STATE_MSG = {
  success: "", timeout: "応答なし", rejected: "機器が拒否",
  network_error: "ネットワーク異常", failed: "取得失敗", spawn_failed: "コマンド起動失敗",
};
const STATE_LABEL = {
  open: "開", closed: "閉", opening: "開いています…", closing: "閉じています…",
  stopped: "途中で停止", unknown: "不明",
};
const VERB = { open: "開けています…", close: "閉めています…", stop: "止めています…" };

const POLL_MS = 4000; // 3〜5 秒ポーリング（状態は pull）。

const app = document.getElementById("app");
const cards = new Map();  // device name -> {statusEl, labelEl, msgEl, buttons, state}
const groups = [];        // {name, el, buttons, busyEl, summaryEl, members}
let polling = false;
let busyCount = 0;        // 操作中はポーリングを止め、3610 の取り合いを避ける。

async function api(method, path) {
  const res = await fetch(path, { method, headers: { "accept": "application/json" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* ── 一括グループバー ───────────────────────────── */
function buildGroup(g) {
  const el = document.createElement("div");
  el.className = "group";
  el.innerHTML = `
    <div class="ghead">
      <span class="gname"></span>
      <span class="gsum"></span>
    </div>
    <div class="gctl">
      <button class="act open" data-op="open">開ける</button>
      <button class="act close" data-op="close">閉める</button>
    </div>
    <div class="gbusy"></div>
  `;
  el.querySelector(".gname").textContent = g.label + " 一括";
  if (g.stop) {
    const b = document.createElement("button");
    b.className = "act stop"; b.dataset.op = "stop"; b.textContent = "止める";
    el.querySelector(".gctl").appendChild(b);
  }
  const buttons = [...el.querySelectorAll("button.act")];
  const rec = {
    name: g.name, el, buttons, members: g.members,
    busyEl: el.querySelector(".gbusy"),
    summaryEl: el.querySelector(".gsum"),
  };
  for (const btn of buttons) btn.addEventListener("click", () => groupAct(rec, btn.dataset.op));
  groups.push(rec);
  return el;
}

function updateGroupSummaries() {
  for (const g of groups) {
    const counts = { open: 0, closed: 0, other: 0 };
    for (const m of g.members) {
      const c = cards.get(m);
      const s = c ? c.state : "unknown";
      if (s === "open") counts.open++;
      else if (s === "closed") counts.closed++;
      else counts.other++;
    }
    const parts = [];
    if (counts.open) parts.push("開 " + counts.open);
    if (counts.closed) parts.push("閉 " + counts.closed);
    if (counts.other) parts.push("他 " + counts.other);
    g.summaryEl.textContent = parts.join(" / ");
  }
}

/* ── デバイスカード（コンパクト）─────────────────── */
function buildCard(dev) {
  const el = document.createElement("div");
  el.className = "device";
  el.innerHTML = `
    <div class="info">
      <div class="name"></div>
      <div class="status unknown"><span class="dot"></span><span class="label">不明</span><span class="msg"></span></div>
    </div>
    <div class="controls">
      <button class="act open" data-op="open">開</button>
      <button class="act close" data-op="close">閉</button>
    </div>
  `;
  el.querySelector(".name").textContent = dev.label;
  if (dev.stop) {
    const b = document.createElement("button");
    b.className = "act stop"; b.dataset.op = "stop"; b.textContent = "停";
    el.querySelector(".controls").appendChild(b);
  }
  const c = {
    statusEl: el.querySelector(".status"),
    labelEl: el.querySelector(".status .label"),
    msgEl: el.querySelector(".status .msg"),
    buttons: [...el.querySelectorAll("button.act")],
    state: "unknown",
  };
  for (const btn of c.buttons) btn.addEventListener("click", () => deviceAct(dev.name, btn.dataset.op));
  cards.set(dev.name, c);
  return el;
}

function renderState(name, view) {
  const c = cards.get(name);
  if (!c) return;
  const st = view.state || "unknown";
  c.state = st;
  c.statusEl.className = "status " + st;
  c.labelEl.textContent = STATE_LABEL[st] || "不明";
  const m = STATE_MSG[view.exec] || "";
  c.msgEl.textContent = m;
  if (m) c.statusEl.classList.add("error");
}

function setDeviceBusy(name, busy) {
  const c = cards.get(name);
  if (c) for (const b of c.buttons) b.disabled = busy;
}

function setAllButtonsDisabled(disabled) {
  for (const c of cards.values()) for (const b of c.buttons) b.disabled = disabled;
  for (const g of groups) for (const b of g.buttons) b.disabled = disabled;
}

/* ── 単一デバイス操作 ───────────────────────────── */
async function deviceAct(name, op) {
  busyCount++;
  setDeviceBusy(name, true);
  const c = cards.get(name);
  if (c) c.msgEl.textContent = VERB[op] || "実行中…";
  try {
    const view = await api("POST", `/api/devices/${encodeURIComponent(name)}/${op}`);
    renderState(name, view);
    const am = ACTION_MSG[view.action] || "";
    if (am) { c.msgEl.textContent = "⚠ " + am; c.statusEl.classList.add("error"); }
  } catch (e) {
    if (c) { c.msgEl.textContent = "⚠ 通信エラー"; c.statusEl.classList.add("error"); }
  } finally {
    setDeviceBusy(name, false);
    busyCount--;
    updateGroupSummaries();
  }
}

/* ── 一括操作 ───────────────────────────────────── */
async function groupAct(g, op) {
  busyCount++;
  setAllButtonsDisabled(true);
  g.busyEl.innerHTML = `<span class="spin"></span>${VERB[op] || "実行中…"}（${g.members.length} 台）`;
  try {
    // 全メンバーをサーバ側で順次実行 → 各 set 後の state を返す。
    const results = await api("POST", `/api/groups/${encodeURIComponent(g.name)}/${op}`);
    let warn = 0;
    for (const r of results) {
      renderState(r.name, r);
      if (!r.skipped && (ACTION_MSG[r.action] || "")) warn++;
    }
    g.busyEl.textContent = warn ? `⚠ ${warn} 台 失敗（個別に再試行）` : "";
  } catch (e) {
    g.busyEl.textContent = "⚠ 通信エラー";
  } finally {
    setAllButtonsDisabled(false);
    busyCount--;
    updateGroupSummaries();
  }
}

/* ── ポーリング ─────────────────────────────────── */
async function pollOnce() {
  if (busyCount > 0) return;
  for (const name of cards.keys()) {
    if (busyCount > 0) return;
    try {
      const view = await api("GET", `/api/devices/${encodeURIComponent(name)}/state`);
      renderState(name, view);
    } catch (e) {
      const c = cards.get(name);
      if (c) { c.msgEl.textContent = "接続なし"; c.statusEl.classList.add("error"); }
    }
  }
  updateGroupSummaries();
}

function startPolling() {
  if (polling) return;
  polling = true;
  const tick = async () => { await pollOnce(); setTimeout(tick, POLL_MS); };
  tick();
}

async function boot() {
  let devices, grps;
  try {
    [devices, grps] = await Promise.all([
      api("GET", "/api/devices"),
      api("GET", "/api/groups").catch(() => []),
    ]);
  } catch (e) {
    app.innerHTML = `<div class="boot">⚠ サーバに接続できません</div>`;
    return;
  }
  if (!devices.length) {
    app.innerHTML = `<div class="boot">config に device がありません</div>`;
    return;
  }
  app.innerHTML = "";
  for (const g of grps) app.appendChild(buildGroup(g));
  for (const dev of devices) app.appendChild(buildCard(dev));
  startPolling();
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) pollOnce(); });

boot();
</script>
</body>
</html>
