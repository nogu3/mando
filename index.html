<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>mando</title>
<style>
  :root {
    --bg: #090c14;
    --bg2: #0f131e;
    --panel: rgba(22, 27, 38, 0.70);
    --panel2: rgba(28, 34, 48, 0.80);
    --line: rgba(150, 170, 210, 0.10);
    --line2: rgba(150, 170, 210, 0.18);
    --fg: #e9edf5;
    --muted: #8b93a7;
    --accent: #6ea8fe;
    --open: #18b88a;
    --open2: #0f9b73;
    --closed: #e8a13a;
    --closed2: #cf8420;
    --moving: #d9b24e;
    --stopped: #5d8fd0;
    --unknown: #545d72;
    --stop: #424b5e;
    --stop2: #333b4c;
    --warn: #f0635a;
    --tap: 0.12s cubic-bezier(.2,.8,.3,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1100px 700px at 18% -8%, rgba(110,168,254,0.13), transparent 60%),
      radial-gradient(900px 620px at 108% 10%, rgba(24,184,138,0.09), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg) 58%);
    background-attachment: fixed;
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 20px 18px 6px; display: flex; align-items: center; gap: 12px;
    max-width: 560px; margin: 0 auto;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: grid; place-items: center; font-size: 18px;
    background: linear-gradient(145deg, #2a3550, #1a2030);
    border: 1px solid var(--line2);
    box-shadow: 0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
  }
  header h1 {
    font-size: 21px; margin: 0; font-weight: 800; letter-spacing: .02em;
    background: linear-gradient(90deg, #fff, #b9c6e0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .sub { color: var(--muted); font-size: 12px; align-self: flex-end; padding-bottom: 3px; }
  main { padding: 8px 14px 32px; max-width: 560px; margin: 0 auto; }

  /* ── 一括グループバー ──────────────── */
  .group {
    background: var(--panel2); border: 1px solid var(--line2);
    border-radius: 20px; padding: 14px 16px; margin: 8px 0 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }
  .group .ghead {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
  }
  .group .gname { font-size: 16px; font-weight: 800; letter-spacing: .01em; }
  .group .gsum {
    color: var(--muted); font-size: 12px; margin-left: auto;
    background: rgba(255,255,255,.05); padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line);
  }
  .group .gctl { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .group .gbusy { font-size: 12px; color: var(--muted); margin-top: 0; min-height: 0; }
  .group .gbusy:not(:empty) { margin-top: 10px; }

  /* ── デバイス一覧（コンパクト・全件 1 画面）──────────── */
  .device {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 14px; margin: 10px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: border-color var(--tap), transform var(--tap);
  }
  .device:active { transform: scale(.995); }
  .device .info { flex: 1; min-width: 0; }
  .device .name { font-size: 16px; font-weight: 700; line-height: 1.2; }
  .status { display: flex; align-items: center; gap: 7px; margin-top: 5px; min-height: 18px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--unknown); flex: none;
    transition: background var(--tap), box-shadow var(--tap);
  }
  .status.open    .dot { background: var(--open);    box-shadow: 0 0 0 3px rgba(24,184,138,.16), 0 0 10px rgba(24,184,138,.5); }
  .status.closed  .dot { background: var(--closed);  box-shadow: 0 0 0 3px rgba(232,161,58,.16), 0 0 10px rgba(232,161,58,.5); }
  .status.opening .dot,
  .status.closing .dot { background: var(--moving); box-shadow: 0 0 10px rgba(217,178,78,.6); animation: pulse 1s ease-in-out infinite; }
  .status.stopped .dot { background: var(--stopped); box-shadow: 0 0 0 3px rgba(93,143,208,.16); }
  .status.on  .dot { background: var(--open);   box-shadow: 0 0 0 3px rgba(24,184,138,.16), 0 0 10px rgba(24,184,138,.5); }
  .status.off .dot { background: var(--unknown); }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.85); } }
  .status .label { font-size: 13px; color: var(--fg); font-weight: 600; }
  .status .msg { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .status.error .msg { color: var(--warn); }

  /* ── light タイル（2 列グリッド）────────────────── */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .tile {
    border-radius: 16px; padding: 13px;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 4px 16px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; gap: 4px;
    animation: rise .35s cubic-bezier(.2,.8,.3,1) both;
    transition: border-color var(--tap), box-shadow var(--tap);
  }
  .tile.lit {
    background: linear-gradient(135deg, rgba(255,184,77,.16), var(--panel) 62%);
    border-color: rgba(255,184,77,.30);
    box-shadow: 0 0 22px rgba(255,184,77,.10), 0 4px 16px rgba(0,0,0,.28);
  }
  button.bulb {
    appearance: none; width: 66px; height: 66px; border-radius: 50%;
    border: 1px solid var(--line2); font-size: 30px; align-self: center;
    margin: 2px 0 4px; padding: 0; cursor: pointer;
    background: rgba(255,255,255,.04); filter: grayscale(1); opacity: .55;
    touch-action: manipulation; user-select: none;
    transition: transform var(--tap), filter var(--tap), opacity var(--tap), box-shadow var(--tap);
  }
  .tile.lit button.bulb {
    border-color: transparent; filter: none; opacity: 1;
    background: radial-gradient(circle at 50% 38%, rgba(255,214,140,.45), rgba(255,184,77,.10) 72%);
    box-shadow: 0 0 22px rgba(255,184,77,.35), inset 0 1px 0 rgba(255,255,255,.2);
  }
  button.bulb:active:not(:disabled) { transform: scale(.93); }
  button.bulb:disabled { opacity: .35; cursor: progress; }
  .tile .tname { font-size: 14px; font-weight: 700; text-align: center; }
  .tile .status { justify-content: center; margin-top: 2px; min-height: 16px; }
  .tile.lit .status .label { color: #ffca7a; }
  /* ── 色変更ボタン + 色選択ボトムシート ─────────────── */
  button.colorbtn {
    appearance: none; width: 100%; min-height: 44px; margin-top: 7px;
    border: 1px solid var(--line2); border-radius: 12px;
    background: rgba(255,255,255,.05); color: var(--fg);
    font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    touch-action: manipulation; user-select: none;
    transition: transform var(--tap), opacity var(--tap), background var(--tap);
  }
  button.colorbtn:active:not(:disabled) { transform: scale(.97); background: rgba(255,255,255,.10); }
  button.colorbtn:disabled { opacity: .4; cursor: progress; }
  .cdot {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 1px solid rgba(255,255,255,.25);
    background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .dim {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .dim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    max-width: 560px; margin: 0 auto;
    background: var(--bg2); border: 1px solid var(--line2); border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 40px rgba(0,0,0,.5);
    transform: translateY(100%); transition: transform .22s cubic-bezier(.2,.8,.3,1);
  }
  .sheet.show { transform: none; }
  .sheet h2 { margin: 0 0 8px; font-size: 15px; font-weight: 800; }
  button.crow {
    appearance: none; display: flex; align-items: center; gap: 12px;
    width: 100%; min-height: 48px; padding: 0 8px;
    background: none; border: none; border-radius: 12px;
    color: var(--fg); font-size: 14px; font-weight: 600; cursor: pointer;
    touch-action: manipulation; user-select: none;
  }
  button.crow:active:not(:disabled) { background: rgba(255,255,255,.07); }
  button.crow:disabled { opacity: .4; cursor: progress; }
  .crow .pdot {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    border: 2px solid transparent;
  }
  .crow.sel .pdot { border-color: #ffca7a; box-shadow: 0 0 0 2px rgba(255,202,122,.3); }
  .crow .pdot.nocolor { border: 1px dashed var(--line2); }
  .sheet .divider {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--muted); font-weight: 700;
    letter-spacing: .06em; margin: 12px 0 4px;
  }
  .sheet .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sliders { display: flex; flex-direction: column; gap: 4px; padding: 2px 2px 0; }
  input.cslider {
    appearance: none; -webkit-appearance: none;
    width: 100%; height: 44px; margin: 0; background: none; touch-action: pan-y;
  }
  input.cslider:disabled { opacity: .4; cursor: progress; }
  input.cslider::-webkit-slider-runnable-track {
    height: 14px; border-radius: 999px; border: 1px solid var(--line2);
    background: var(--track, #888);
  }
  input.cslider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 44px; height: 44px; margin-top: -16px; border-radius: 50%;
    border: 3px solid #fff; background: var(--thumb, #888);
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  input.cslider::-moz-range-track {
    height: 14px; border-radius: 999px; border: 1px solid var(--line2);
    background: var(--track, #888);
  }
  input.cslider::-moz-range-thumb {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid #fff; background: var(--thumb, #888);
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  input.cslider.hue {
    --track: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }

  .controls { display: flex; gap: 8px; flex: none; }
  button.act {
    appearance: none; border: none; border-radius: 14px;
    font-weight: 800; color: #fff; cursor: pointer; position: relative;
    transition: transform var(--tap), filter var(--tap), opacity var(--tap), box-shadow var(--tap);
    touch-action: manipulation; user-select: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
  }
  /* デバイス個別: 短ラベルの中ターゲット */
  .controls button.act { width: 56px; min-height: 54px; font-size: 18px; letter-spacing: .04em; }
  /* 一括: 大ターゲット */
  .group .gctl button.act { min-height: 66px; font-size: 19px; letter-spacing: .06em; }
  .group .gctl button.stop { grid-column: 1 / -1; min-height: 50px; font-size: 16px; }
  button.open  { background: linear-gradient(160deg, var(--open),   var(--open2)); }
  button.close { background: linear-gradient(160deg, var(--closed), var(--closed2)); }
  button.stop  { background: linear-gradient(160deg, var(--stop),   var(--stop2)); }
  button.on  { background: linear-gradient(160deg, var(--open),   var(--open2)); }
  button.off { background: linear-gradient(160deg, var(--stop),   var(--stop2)); }
  button.act:active:not(:disabled) { transform: scale(.95); filter: brightness(1.1); box-shadow: 0 2px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22); }
  button.act:disabled { opacity: .4; cursor: progress; box-shadow: none; }

  .spin {
    display: inline-block; width: 11px; height: 11px; margin-right: 6px;
    border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%;
    animation: spin .7s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .device, .group { animation: rise .35s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── セクション見出し ─────────────────────────── */
  .sec {
    font-size: 12px; color: var(--muted); font-weight: 700;
    letter-spacing: .08em; margin: 18px 4px 2px;
  }
  .sec:first-child { margin-top: 6px; }

  /* ── シャッター個別の折りたたみ ─────────────────── */
  button.expander {
    appearance: none; width: 100%; margin-top: 11px; padding: 9px;
    background: none; border: none; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer;
    touch-action: manipulation; user-select: none;
  }
  button.expander:active { color: var(--fg); }
  .drow {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--line); padding: 9px 2px;
  }
  .drow .dinfo { flex: 1; min-width: 0; }
  .drow .dname { font-size: 13px; font-weight: 700; }
  .drow .status { margin-top: 3px; min-height: 16px; }
  .drow button.act { width: 46px; min-height: 44px; font-size: 15px; border-radius: 12px; }

  /* ── きろく（embalse グラフ）─────────────────── */
  .sec.krow { display: flex; align-items: center; gap: 10px; }
  .ptabs {
    display: flex; gap: 2px; margin-left: auto;
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px;
  }
  .ptabs button {
    appearance: none; border: none; border-radius: 999px;
    background: none; color: var(--muted); font-size: 12px; font-weight: 700;
    padding: 6px 14px; cursor: pointer; touch-action: manipulation; user-select: none;
    transition: background var(--tap), color var(--tap);
  }
  .ptabs button.sel { background: var(--accent); color: #0b1020; }
  .gcard {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 14px; margin: 10px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: rise .35s cubic-bezier(.2,.8,.3,1) both;
  }
  .gcard .ghd { display: flex; align-items: baseline; gap: 8px; }
  .gcard .gtitle { font-size: 14px; font-weight: 700; }
  .gcard .gval { margin-left: auto; font-size: 16px; font-weight: 800; }
  .gcard .gval .u { font-size: 11px; color: var(--muted); font-weight: 700; margin-left: 3px; }
  .gcard .gsub { font-size: 11px; color: var(--muted); min-height: 15px; margin-top: 2px; }
  .gcard .glegend {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px;
    font-size: 11px; color: var(--muted);
  }
  .gcard .glegend[hidden] { display: none; }
  .gcard .glegend .k { display: inline-flex; align-items: center; gap: 5px; }
  .gcard .glegend .kd { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .gcard svg { display: block; width: 100%; height: auto; margin-top: 8px; touch-action: pan-y; }
  .gcard .gmsg { font-size: 12px; color: var(--muted); padding: 22px 0; text-align: center; }
  .gcard .gmsg.error { color: var(--warn); }

  .boot { color: var(--muted); padding: 28px 6px; text-align: center; }
</style>
</head>
<body>
<header>
  <span class="logo">🛰</span>
  <h1>mando</h1>
  <span class="sub">家のリモコン</span>
</header>
<main id="app">
  <div class="boot">読み込み中…</div>
</main>

<script>
"use strict";

// set コマンドの exec 結果 → UI メッセージ（設計原則 7）。
const ACTION_MSG = {
  success: "", timeout: "応答なし、もう一度", rejected: "機器が拒否",
  network_error: "ネットワーク異常", failed: "操作に失敗", spawn_failed: "コマンド起動失敗",
};
// state 取得の exec 結果 → UI メッセージ。
const STATE_MSG = {
  success: "", timeout: "応答なし", rejected: "機器が拒否",
  network_error: "ネットワーク異常", failed: "取得失敗", spawn_failed: "コマンド起動失敗",
};
const STATE_LABEL = {
  open: "開", closed: "閉", opening: "開いています…", closing: "閉じています…",
  stopped: "途中で停止", on: "点灯", off: "消灯", unknown: "不明",
};
const VERB = {
  open: "開けています…", close: "閉めています…", stop: "止めています…",
  on: "つけています…", off: "消しています…", preset: "変更中…",
};

const POLL_MS = 4000; // 3〜5 秒ポーリング（状態は pull）。
const LIGHT_CATCHUP_MS = 2000; // light: 操作後に 1 回だけ state を追いつき取得するまでの待ち。

const app = document.getElementById("app");
const cards = new Map();  // device name -> {statusEl, labelEl, msgEl, buttons, state}
const groups = [];        // {name, el, buttons, busyEl, summaryEl, members}
let polling = false;
let busyCount = 0;        // 操作中はポーリングを止め、3610 の取り合いを避ける。

async function api(method, path, body) {
  const opts = { method, headers: { "accept": "application/json" } };
  if (body !== undefined) {
    opts.headers["content-type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* ── 一括グループバー ───────────────────────────── */
function buildGroup(g, byName) {
  const el = document.createElement("div");
  el.className = "group";
  el.innerHTML = `
    <div class="ghead">
      <span class="gname"></span>
      <span class="gsum"></span>
    </div>
    <div class="gctl">
      <button class="act open" data-op="open">開ける</button>
      <button class="act close" data-op="close">閉める</button>
    </div>
    <div class="gbusy"></div>
    <button class="expander" type="button">個別に操作 ▾</button>
    <div class="members" hidden></div>
  `;
  el.querySelector(".gname").textContent = g.label + " 一括";
  if (g.stop) {
    const b = document.createElement("button");
    b.className = "act stop"; b.dataset.op = "stop"; b.textContent = "止める";
    el.querySelector(".gctl").appendChild(b);
  }
  const membersEl = el.querySelector(".members");
  for (const m of g.members) {
    const dev = byName.get(m);
    if (dev) membersEl.appendChild(buildMemberRow(dev));
  }
  const exp = el.querySelector(".expander");
  exp.addEventListener("click", () => {
    membersEl.hidden = !membersEl.hidden;
    exp.textContent = membersEl.hidden ? "個別に操作 ▾" : "個別に操作 ▴";
  });
  const buttons = [...el.querySelectorAll(".gctl button.act")];
  const rec = {
    name: g.name, el, buttons, members: g.members,
    busyEl: el.querySelector(".gbusy"),
    summaryEl: el.querySelector(".gsum"),
  };
  for (const btn of buttons) btn.addEventListener("click", () => groupAct(rec, btn.dataset.op));
  groups.push(rec);
  return el;
}

function updateGroupSummaries() {
  for (const g of groups) {
    const counts = { open: 0, closed: 0, other: 0 };
    for (const m of g.members) {
      const c = cards.get(m);
      const s = c ? c.state : "unknown";
      if (s === "open") counts.open++;
      else if (s === "closed") counts.closed++;
      else counts.other++;
    }
    const parts = [];
    if (counts.open) parts.push("開 " + counts.open);
    if (counts.closed) parts.push("閉 " + counts.closed);
    if (counts.other) parts.push("他 " + counts.other);
    g.summaryEl.textContent = parts.join(" / ");
  }
}

/* ── グループ内の個別シャッター行（折りたたみ内）───── */
function buildMemberRow(dev) {
  const el = document.createElement("div");
  el.className = "drow";
  el.innerHTML = `
    <div class="dinfo">
      <div class="dname"></div>
      <div class="status unknown"><span class="dot"></span><span class="label">不明</span><span class="msg"></span></div>
    </div>
    <button class="act open" data-op="open">開</button>
    <button class="act close" data-op="close">閉</button>
  `;
  el.querySelector(".dname").textContent = dev.label;
  if (dev.stop) {
    const b = document.createElement("button");
    b.className = "act stop"; b.dataset.op = "stop"; b.textContent = "停";
    el.appendChild(b);
  }
  const c = {
    statusEl: el.querySelector(".status"),
    labelEl: el.querySelector(".status .label"),
    msgEl: el.querySelector(".status .msg"),
    buttons: [...el.querySelectorAll("button.act")],
    kind: "shutter",
    state: "unknown",
  };
  for (const btn of c.buttons) btn.addEventListener("click", () => deviceAct(dev.name, btn.dataset.op));
  cards.set(dev.name, c);
  return el;
}

function sectionHeading(text) {
  const el = document.createElement("div");
  el.className = "sec";
  el.textContent = text;
  return el;
}

/* ── デバイスカード（コンパクト）─────────────────── */
function buildCard(dev) {
  const el = document.createElement("div");
  el.className = "device";
  el.innerHTML = `
    <div class="info">
      <div class="name"></div>
      <div class="status unknown"><span class="dot"></span><span class="label">不明</span><span class="msg"></span></div>
    </div>
    <div class="controls">
      <button class="act open" data-op="open">開</button>
      <button class="act close" data-op="close">閉</button>
    </div>
  `;
  el.querySelector(".name").textContent = dev.label;
  if (dev.stop) {
    const b = document.createElement("button");
    b.className = "act stop"; b.dataset.op = "stop"; b.textContent = "停";
    el.querySelector(".controls").appendChild(b);
  }
  const c = {
    statusEl: el.querySelector(".status"),
    labelEl: el.querySelector(".status .label"),
    msgEl: el.querySelector(".status .msg"),
    buttons: [...el.querySelectorAll("button.act")],
    kind: "shutter",
    state: "unknown",
  };
  for (const btn of c.buttons) btn.addEventListener("click", () => deviceAct(dev.name, btn.dataset.op));
  cards.set(dev.name, c);
  return el;
}

/* ── light タイル（電球ボタン = スイッチ + 色変更ボタン）──── */
function buildLightTile(dev) {
  const el = document.createElement("div");
  el.className = "tile";
  el.innerHTML = `
    <button class="bulb" type="button" aria-label="点灯/消灯">💡</button>
    <div class="tname"></div>
    <div class="status unknown"><span class="label">不明</span><span class="msg"></span></div>
  `;
  el.querySelector(".tname").textContent = dev.label;
  // preset も color も brightness も無い light はボタン自体を出さない。
  if (dev.presets.length || dev.color_supported || dev.brightness_supported) {
    const btn = document.createElement("button");
    btn.className = "colorbtn";
    btn.type = "button";
    btn.innerHTML = `<span class="cdot"></span>あかり調整`;
    btn.addEventListener("click", () => openSheet(dev));
    el.appendChild(btn);
  }
  const c = {
    kind: "light",
    rootEl: el,
    statusEl: el.querySelector(".status"),
    labelEl: el.querySelector(".status .label"),
    msgEl: el.querySelector(".status .msg"),
    dotEl: el.querySelector(".cdot"), // colorbtn 内の「最後に押した色」ドット（無ければ null）
    buttons: [...el.querySelectorAll("button")], // bulb + colorbtn を busy 対象に
    state: "unknown",
    lastSel: null, // このセッションで最後に押した色（"preset:<name>" | "custom"）
    lastHue: 30,   // シート再訪時のスライダー初期位置
    lastSat: 100,
    lastBright: 100, // シート再訪時の明るさスライダー初期位置（現在値は state に出ない）
    catchupTimer: null, // 追いつき取得タイマー（device ごとに 1 本、連打時は張り直し）
  };
  el.querySelector(".bulb").addEventListener("click", () =>
    deviceAct(dev.name, c.state === "on" ? "off" : "on")
  );
  cards.set(dev.name, c);
  return el;
}

/* ── 色選択ボトムシート（ページ共有の 1 枚、開くたびに対象 device へ組み替え）── */
const dimEl = document.createElement("div");
dimEl.className = "dim";
const sheetEl = document.createElement("div");
sheetEl.className = "sheet";
document.body.append(dimEl, sheetEl);
let sheetDevice = null; // 開いている対象 device 名（busy 制御用）
dimEl.addEventListener("click", closeSheet);

function closeSheet() {
  dimEl.classList.remove("show");
  sheetEl.classList.remove("show");
  sheetDevice = null;
}

/* HSV → "#rrggbb"。V は常に 100%（mat group color は明度を捨てる仕様。UI にも出さない）。 */
function hsvToHex(h, s) {
  const f = (n) => {
    const k = (n + h / 60) % 6;
    return Math.round((1 - s * Math.max(0, Math.min(k, 4 - k, 1))) * 255)
      .toString(16).padStart(2, "0");
  };
  return "#" + f(5) + f(3) + f(1);
}

/* 「セッションで最後に押した色」を記録し、タイルの colorbtn ドットへ反映。 */
function markLastColor(c, sel, cssColor) {
  c.lastSel = sel;
  if (cssColor && c.dotEl) c.dotEl.style.background = cssColor;
}

function openSheet(dev) {
  const c = cards.get(dev.name);
  if (!c) return;
  sheetDevice = dev.name;
  sheetEl.innerHTML = "";

  const h = document.createElement("h2");
  h.textContent = `${dev.label} のあかり`;
  sheetEl.appendChild(h);

  if (dev.brightness_supported) {
    const bwrap = document.createElement("div");
    bwrap.className = "sliders";
    const blabel = document.createElement("div");
    blabel.className = "divider";
    blabel.textContent = "あかりの強さ";
    const bright = document.createElement("input");
    bright.type = "range"; bright.min = "1"; bright.max = "100"; bright.step = "1";
    bright.value = String(c.lastBright);
    bright.className = "cslider";
    bright.setAttribute("aria-label", "あかりの強さ");
    bwrap.appendChild(bright);
    sheetEl.appendChild(blabel);
    sheetEl.appendChild(bwrap);
    // ドラッグ中（input）は送らず、離した時（change）に 1 回だけ送信
    // — exec 直列（Semaphore(1)）と相性を保つ。
    bright.addEventListener("change", () => {
      c.lastBright = +bright.value;
      brightnessAct(dev.name, +bright.value);
    });
  }

  for (const p of dev.presets) {
    const row = document.createElement("button");
    row.className = "crow";
    row.type = "button";
    const dot = document.createElement("span");
    dot.className = "pdot" + (p.color ? "" : " nocolor");
    if (p.color) dot.style.background = p.color;
    const nm = document.createElement("span");
    nm.textContent = p.label;
    row.append(dot, nm);
    // .sel リングは「セッションで最後に押した色」。現在色の主張はしない（原則 7）。
    if (c.lastSel === "preset:" + p.name) row.classList.add("sel");
    row.addEventListener("click", () => {
      for (const r of sheetEl.querySelectorAll(".crow.sel")) r.classList.remove("sel");
      row.classList.add("sel");
      markLastColor(c, "preset:" + p.name, p.color);
      presetAct(dev.name, p.name);
    });
    sheetEl.appendChild(row);
  }

  if (dev.color_supported) {
    const div = document.createElement("div");
    div.className = "divider";
    div.textContent = "すきな色";
    sheetEl.appendChild(div);

    const wrap = document.createElement("div");
    wrap.className = "sliders";
    const hue = document.createElement("input");
    hue.type = "range"; hue.min = "0"; hue.max = "360"; hue.step = "1";
    hue.value = String(c.lastHue);
    hue.className = "cslider hue";
    hue.setAttribute("aria-label", "いろあい");
    const sat = document.createElement("input");
    sat.type = "range"; sat.min = "0"; sat.max = "100"; sat.step = "1";
    sat.value = String(c.lastSat);
    sat.className = "cslider";
    sat.setAttribute("aria-label", "こさ");
    wrap.append(hue, sat);
    sheetEl.appendChild(wrap);

    // こさスライダーの右端色（と各つまみ）は現在の色相に追従させる。
    const paint = () => {
      const hv = +hue.value, sv = +sat.value / 100;
      hue.style.setProperty("--thumb", hsvToHex(hv, 1));
      sat.style.setProperty("--track", `linear-gradient(90deg, #fff, ${hsvToHex(hv, 1)})`);
      sat.style.setProperty("--thumb", hsvToHex(hv, sv));
    };
    // ドラッグ中（input）は描画のみ。送信は離した時（change）に 1 回だけ
    // — exec 直列（Semaphore(1)）と相性を保つ。
    const send = () => {
      c.lastHue = +hue.value;
      c.lastSat = +sat.value;
      const hex = hsvToHex(+hue.value, +sat.value / 100);
      for (const r of sheetEl.querySelectorAll(".crow.sel")) r.classList.remove("sel");
      markLastColor(c, "custom", hex);
      colorAct(dev.name, hex);
    };
    hue.addEventListener("input", paint);
    sat.addEventListener("input", paint);
    hue.addEventListener("change", send);
    sat.addEventListener("change", send);
    paint();
  }

  dimEl.classList.add("show");
  sheetEl.classList.add("show");
}

/* ── 任意色実行（light 専用）─────────────────────── */
async function colorAct(name, hex) {
  return lightAct(
    name,
    VERB.preset,
    `/api/devices/${encodeURIComponent(name)}/color`,
    { color: hex }
  );
}

/* ── 明るさ実行（light 専用）─────────────────────── */
async function brightnessAct(name, level) {
  return lightAct(
    name,
    VERB.preset,
    `/api/devices/${encodeURIComponent(name)}/brightness`,
    { brightness: level }
  );
}

/* ── プリセット実行（light 専用）───────────────────── */
async function presetAct(name, preset) {
  return lightAct(
    name,
    VERB.preset,
    `/api/devices/${encodeURIComponent(name)}/presets/${encodeURIComponent(preset)}`
  );
}

/* ── light 操作: POST は送信結果のみ。state は ~2 秒後に 1 回だけ追いつき取得 ── */
async function lightAct(name, verb, path, body) {
  const c = cards.get(name);
  busyCount++;
  setDeviceBusy(name, true);
  if (c) c.msgEl.textContent = verb;
  try {
    const view = await api("POST", path, body);
    const am = ACTION_MSG[view.action] || "";
    if (am) {
      if (c.catchupTimer) { clearTimeout(c.catchupTimer); c.catchupTimer = null; }
      c.msgEl.textContent = "⚠ " + am;
      c.statusEl.classList.add("error");
    } else {
      // 成功 = 送信できただけ。中間表示にして追いつき取得を予約する。
      c.statusEl.classList.remove("error");
      c.msgEl.textContent = "";
      c.labelEl.textContent = "反映中…";
      scheduleLightCatchup(name);
    }
  } catch (e) {
    if (c) {
      if (c.catchupTimer) { clearTimeout(c.catchupTimer); c.catchupTimer = null; }
      c.msgEl.textContent = "⚠ 通信エラー"; c.statusEl.classList.add("error");
    }
  } finally {
    setDeviceBusy(name, false);
    busyCount--;
  }
}

function scheduleLightCatchup(name) {
  const c = cards.get(name);
  if (!c) return;
  if (c.catchupTimer) clearTimeout(c.catchupTimer); // 連打時は張り直し
  c.catchupTimer = setTimeout(async () => {
    c.catchupTimer = null;
    // busy（連打中・一括操作中）なら延期して再アーム。ボタンが空き次第 1 回だけ取得する。
    if (c.buttons.some((b) => b.disabled)) {
      scheduleLightCatchup(name);
      return;
    }
    try {
      const view = await api("GET", `/api/devices/${encodeURIComponent(name)}/state`);
      renderState(name, view);
    } catch (e) {
      // 外れていても次の操作 or ページ再表示で直る。
    }
  }, LIGHT_CATCHUP_MS);
}

function renderState(name, view) {
  const c = cards.get(name);
  if (!c) return;
  const st = view.state || "unknown";
  c.state = st;
  c.statusEl.className = "status " + st;
  c.labelEl.textContent = STATE_LABEL[st] || "不明";
  if (c.rootEl) c.rootEl.classList.toggle("lit", st === "on");
  const m = STATE_MSG[view.exec] || "";
  c.msgEl.textContent = m;
  if (m) c.statusEl.classList.add("error");
}

/* シートが対象 device（name=null なら無条件）を開いていれば、シート内の操作も止める。 */
function setSheetDisabled(name, busy) {
  if (sheetDevice !== null && (name === null || sheetDevice === name)) {
    for (const el of sheetEl.querySelectorAll("button, input")) el.disabled = busy;
  }
}

function setDeviceBusy(name, busy) {
  const c = cards.get(name);
  if (c) for (const b of c.buttons) b.disabled = busy;
  setSheetDisabled(name, busy);
}

function setAllButtonsDisabled(disabled) {
  for (const c of cards.values()) for (const b of c.buttons) b.disabled = disabled;
  for (const g of groups) for (const b of g.buttons) b.disabled = disabled;
  setSheetDisabled(null, disabled);
}

/* ── 単一デバイス操作 ───────────────────────────── */
async function deviceAct(name, op) {
  const c = cards.get(name);
  if (c && c.kind === "light") {
    return lightAct(name, VERB[op] || "実行中…", `/api/devices/${encodeURIComponent(name)}/${op}`);
  }
  busyCount++;
  setDeviceBusy(name, true);
  if (c) c.msgEl.textContent = VERB[op] || "実行中…";
  try {
    const view = await api("POST", `/api/devices/${encodeURIComponent(name)}/${op}`);
    renderState(name, view);
    const am = ACTION_MSG[view.action] || "";
    if (am) { c.msgEl.textContent = "⚠ " + am; c.statusEl.classList.add("error"); }
  } catch (e) {
    if (c) { c.msgEl.textContent = "⚠ 通信エラー"; c.statusEl.classList.add("error"); }
  } finally {
    setDeviceBusy(name, false);
    busyCount--;
    updateGroupSummaries();
  }
}

/* ── 一括操作 ───────────────────────────────────── */
async function groupAct(g, op) {
  busyCount++;
  setAllButtonsDisabled(true);
  g.busyEl.innerHTML = `<span class="spin"></span>${VERB[op] || "実行中…"}（${g.members.length} 台）`;
  try {
    // 全メンバーをサーバ側で順次実行 → 各 set 後の state を返す。
    const results = await api("POST", `/api/groups/${encodeURIComponent(g.name)}/${op}`);
    let warn = 0;
    for (const r of results) {
      renderState(r.name, r);
      if (!r.skipped && (ACTION_MSG[r.action] || "")) warn++;
    }
    g.busyEl.textContent = warn ? `⚠ ${warn} 台 失敗（個別に再試行）` : "";
  } catch (e) {
    g.busyEl.textContent = "⚠ 通信エラー";
  } finally {
    setAllButtonsDisabled(false);
    busyCount--;
    updateGroupSummaries();
  }
}

/* ── ポーリング ─────────────────────────────────── */
async function pollOnce() {
  if (busyCount > 0) return;
  for (const [name, c] of cards) {
    if (busyCount > 0) return;
    // light は定期ポーリングしない（mat 直叩きは遅く、exec 直列を詰まらせる）。
    // 表示時 1 回 + 操作後の再取得のみ（fetchLightStatesOnce / scheduleLightCatchup）。
    if (c.kind === "light") continue;
    try {
      const view = await api("GET", `/api/devices/${encodeURIComponent(name)}/state`);
      renderState(name, view);
    } catch (e) {
      if (c) { c.msgEl.textContent = "接続なし"; c.statusEl.classList.add("error"); }
    }
  }
  updateGroupSummaries();
}

function startPolling() {
  if (polling) return;
  polling = true;
  const tick = async () => { await pollOnce(); setTimeout(tick, POLL_MS); };
  tick();
}

/* ── light の初回 state 取得（1 回だけ・ポーリングなし）── */
async function fetchLightStatesOnce(devices) {
  for (const dev of devices) {
    if (dev.kind !== "light") continue;
    try {
      const view = await api("GET", `/api/devices/${encodeURIComponent(dev.name)}/state`);
      renderState(dev.name, view);
    } catch (e) {
      const c = cards.get(dev.name);
      if (c) { c.msgEl.textContent = "接続なし"; c.statusEl.classList.add("error"); }
    }
  }
}

/* ── きろく（embalse グラフ）─────────────────────── */
// dataviz 検証済みカテゴリカルパレット（ダーク面 #10141d で全チェック PASS）。
// 系列へ初出順に固定割当する。循環させない — 5 系列以上は先頭 4 系列のみ描画
// （必要なら config 側でグラフを分割する）。
const GRAPH_COLORS = ["#3987e5", "#008300", "#d55181", "#c98500"];
const GRAPH_SURFACE = "#10141d"; // マーカのサーフェスリング用（パネルの実効色）
const PERIODS = [["today", "今日"], ["week", "週"], ["month", "月"]];
let graphPeriod = "today";
const graphCards = new Map(); // name -> {valEl, subEl, legendEl, bodyEl}

function buildGraphSection(graphList) {
  const head = sectionHeading("📈 きろく");
  head.classList.add("krow");
  const tabs = document.createElement("div");
  tabs.className = "ptabs";
  for (const [p, label] of PERIODS) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.period = p;
    if (p === graphPeriod) b.classList.add("sel");
    b.addEventListener("click", () => {
      if (graphPeriod === p) return;
      graphPeriod = p;
      for (const t of tabs.querySelectorAll("button")) {
        t.classList.toggle("sel", t.dataset.period === p);
      }
      loadGraphs();
    });
    tabs.appendChild(b);
  }
  head.appendChild(tabs);
  app.appendChild(head);

  for (const g of graphList) {
    const card = document.createElement("div");
    card.className = "gcard";
    card.innerHTML = `
      <div class="ghd"><span class="gtitle"></span><span class="gval"></span></div>
      <div class="gsub"></div>
      <div class="glegend" hidden></div>
      <div class="gbody"><div class="gmsg">…</div></div>
    `;
    card.querySelector(".gtitle").textContent = g.label;
    graphCards.set(g.name, {
      valEl: card.querySelector(".gval"),
      subEl: card.querySelector(".gsub"),
      legendEl: card.querySelector(".glegend"),
      bodyEl: card.querySelector(".gbody"),
    });
    app.appendChild(card);
  }
  // 取得はセクションが初めて画面に入ったときまで遅らせる
  // （開いてすぐの操作を重い読み出しで邪魔しない・ポーリングはしない）。
  const io = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting)) {
      io.disconnect();
      loadGraphs();
    }
  }, { rootMargin: "80px" });
  io.observe(head);
}

async function loadGraphs() {
  const period = graphPeriod;
  for (const [name, gc] of graphCards) {
    gc.bodyEl.innerHTML = `<div class="gmsg"><span class="spin"></span>読み込み中…</div>`;
    gc.valEl.textContent = "";
    gc.subEl.textContent = "";
    gc.legendEl.hidden = true;
    try {
      const view = await api(
        "GET",
        `/api/graphs/${encodeURIComponent(name)}?period=${period}`
      );
      if (period !== graphPeriod) return; // タブが切り替わっていたら破棄
      renderGraph(gc, view);
    } catch (e) {
      if (period !== graphPeriod) return;
      // 原則 7: 取得できないものは取得できないと言う（ゼロ埋め・補間で誤魔化さない）。
      gc.bodyEl.innerHTML = `<div class="gmsg error">データを取得できませんでした</div>`;
    }
  }
}

function renderGraph(gc, view) {
  const series = view.series.filter((s) => s.points.length).slice(0, GRAPH_COLORS.length);
  if (!series.length) {
    gc.bodyEl.innerHTML = `<div class="gmsg">まだデータがありません</div>`;
    return;
  }
  // 見出しの要約数値 = 先頭系列の最新値（数字が主、カーブは従）。
  const first = series[0];
  const latest = first.points[first.points.length - 1][1];
  gc.valEl.textContent = fmtNum(latest);
  const u = document.createElement("span");
  u.className = "u";
  u.textContent = view.unit;
  gc.valEl.appendChild(u);
  // generation の今日ビューは合計 kWh を併記（5 分ビン W の積分近似 Σv×(5/60)÷1000）。
  if (view.name === "generation" && view.period === "today") {
    const kwh = (first.points.reduce((a, p) => a + p[1], 0) * (5 / 60)) / 1000;
    gc.subEl.textContent = `今日の合計 約 ${kwh.toFixed(1)} kWh`;
  }
  // 凡例は 2 系列以上のときだけ（単系列はタイトルが系列名を兼ねる）。
  gc.legendEl.innerHTML = "";
  gc.legendEl.hidden = series.length < 2;
  if (series.length >= 2) {
    series.forEach((s, i) => {
      const k = document.createElement("span");
      k.className = "k";
      const d = document.createElement("span");
      d.className = "kd";
      d.style.background = GRAPH_COLORS[i];
      k.append(d, s.label);
      gc.legendEl.appendChild(k);
    });
  }
  gc.bodyEl.innerHTML = "";
  // 今日 = 時系列カーブ。週/月 = 日別集計（単系列は棒、複数系列は折れ線 —
  // 30 日 × 複数系列のグループ棒はスマホで潰れる）。
  const svg =
    view.period !== "today" && series.length === 1
      ? drawBarChart(series[0], view.period)
      : drawLineChart(series, view.period);
  gc.bodyEl.appendChild(svg);
  attachReadout(svg, gc, series, view);
}

/* ── SVG チャート描画（手描き・外部ライブラリなし）───── */
const SVG_NS = "http://www.w3.org/2000/svg";
const PLOT = { w: 320, h: 132, l: 40, r: 8, t: 8, b: 18 };

function svgNode(tag, attrs) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

/* 軸の上端を切りの良い数へ丸める（1/2/5 × 10^n）。 */
function niceCeil(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 5, 10]) if (v <= m * p) return m * p;
  return 10 * p;
}

function fmtNum(v) {
  return Math.abs(v) >= 1000
    ? Math.round(v).toLocaleString("ja-JP")
    : String(Math.round(v * 10) / 10);
}

function fmtTs(d, period) {
  if (period === "today") {
    return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

/* 罫線（hairline・控えめ）+ y 目盛 + x 端ラベルの共通描画。 */
function drawFrame(svg, py, yMin, yMax, xLabels) {
  const { w, h, l, r, b } = PLOT;
  for (const f of [0, 0.5, 1]) {
    const v = yMin + (yMax - yMin) * f;
    const y = py(v);
    svg.appendChild(svgNode("line", {
      x1: l, y1: y, x2: w - r, y2: y,
      stroke: "rgba(150,170,210,0.12)", "stroke-width": 1,
    }));
    const t = svgNode("text", {
      x: l - 5, y: y + 3, "text-anchor": "end",
      "font-size": 9, fill: "var(--muted)",
    });
    t.textContent = fmtNum(v);
    svg.appendChild(t);
  }
  for (const [x, anchor, text] of xLabels) {
    const t = svgNode("text", {
      x, y: h - b + 13, "text-anchor": anchor,
      "font-size": 9, fill: "var(--muted)",
    });
    t.textContent = text;
    svg.appendChild(t);
  }
}

function drawLineChart(series, period) {
  const { w, h, l, r, t, b } = PLOT;
  const svg = svgNode("svg", { viewBox: `0 0 ${w} ${h}`, role: "img" });
  const xs = series.flatMap((s) => s.points.map((p) => Date.parse(p[0])));
  const vs = series.flatMap((s) => s.points.map((p) => p[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const yMin = Math.min(0, ...vs);
  const yMax = niceCeil(Math.max(...vs, 1));
  const px = (x) =>
    x1 === x0 ? l + (w - l - r) / 2 : l + ((x - x0) / (x1 - x0)) * (w - l - r);
  const py = (v) => t + (1 - (v - yMin) / (yMax - yMin)) * (h - t - b);
  drawFrame(svg, py, yMin, yMax, [
    [px(x0), "start", fmtTs(new Date(x0), period)],
    [px(x1), "end", fmtTs(new Date(x1), period)],
  ]);
  series.forEach((s, i) => {
    const color = GRAPH_COLORS[i];
    const d = s.points
      .map((p, j) => `${j ? "L" : "M"}${px(Date.parse(p[0])).toFixed(1)},${py(p[1]).toFixed(1)}`)
      .join("");
    svg.appendChild(svgNode("path", {
      d, fill: "none", stroke: color, "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round",
    }));
    // 終端マーカ（8px）+ サーフェスリング 2px — 線と重なっても読める。
    const lp = s.points[s.points.length - 1];
    svg.appendChild(svgNode("circle", {
      cx: px(Date.parse(lp[0])).toFixed(1), cy: py(lp[1]).toFixed(1),
      r: 4, fill: color, stroke: GRAPH_SURFACE, "stroke-width": 2,
    }));
  });
  return svg;
}

function drawBarChart(s, period) {
  const { w, h, l, r, t, b } = PLOT;
  const svg = svgNode("svg", { viewBox: `0 0 ${w} ${h}`, role: "img" });
  const n = s.points.length;
  const yMax = niceCeil(Math.max(...s.points.map((p) => p[1]), 1));
  const py = (v) => t + (1 - v / yMax) * (h - t - b);
  const slot = (w - l - r) / n;
  // 棒 ≤24px・隣接とは最低 2px の地の間隔。
  const bw = Math.max(2, Math.min(24, slot - 2));
  const first = s.points[0], last = s.points[n - 1];
  drawFrame(svg, py, 0, yMax, [
    [l + slot / 2, "start", fmtTs(new Date(first[0]), period)],
    [l + slot * (n - 0.5), "end", fmtTs(new Date(last[0]), period)],
  ]);
  const y0 = py(0);
  s.points.forEach((p, i) => {
    const x = l + slot * i + (slot - bw) / 2;
    const y = py(p[1]);
    // 上端 4px 丸め・基線は角（データ端だけ丸める）。
    const rr = Math.min(4, bw / 2, Math.max(0, y0 - y));
    svg.appendChild(svgNode("path", {
      d: `M${x},${y0} L${x},${y + rr} Q${x},${y} ${x + rr},${y}` +
         ` L${x + bw - rr},${y} Q${x + bw},${y} ${x + bw},${y + rr} L${x + bw},${y0} Z`,
      fill: GRAPH_COLORS[0],
    }));
  });
  return svg;
}

/* ── ホバー/タッチ読み取り層: 最寄り時点の値を gsub に表示 ── */
// 系列間の時点対応は index ベースの近似（同一クエリ由来のビンは揃っている前提）。
function attachReadout(svg, gc, series, view) {
  const baseSub = gc.subEl.textContent;
  const pts0 = series[0].points;
  const show = (ev) => {
    const rect = svg.getBoundingClientRect();
    const fx = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    const idx = Math.round(fx * (pts0.length - 1));
    const ts = new Date(Date.parse(pts0[idx][0]));
    const vals = series.map((s, i) => {
      const p = s.points[Math.min(idx, s.points.length - 1)];
      return (series.length > 1 ? s.label + " " : "") + fmtNum(p[1]);
    });
    gc.subEl.textContent =
      `${fmtTs(ts, view.period)}  ${vals.join(" / ")} ${view.unit}`;
  };
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerleave", () => { gc.subEl.textContent = baseSub; });
  svg.addEventListener("pointerup", () => { gc.subEl.textContent = baseSub; });
}

async function boot() {
  let devices, grps, graphList;
  try {
    [devices, grps, graphList] = await Promise.all([
      api("GET", "/api/devices"),
      api("GET", "/api/groups").catch(() => []),
      api("GET", "/api/graphs").catch(() => []),
    ]);
  } catch (e) {
    app.innerHTML = `<div class="boot">⚠ サーバに接続できません</div>`;
    return;
  }
  if (!devices.length) {
    app.innerHTML = `<div class="boot">config に device がありません</div>`;
    return;
  }
  app.innerHTML = "";
  const byName = new Map(devices.map((d) => [d.name, d]));
  const lights = devices.filter((d) => d.kind === "light");
  const shutters = devices.filter((d) => d.kind !== "light");
  const grouped = new Set(grps.flatMap((g) => g.members));

  if (lights.length) {
    app.appendChild(sectionHeading("💡 照明"));
    const tiles = document.createElement("div");
    tiles.className = "tiles";
    for (const dev of lights) tiles.appendChild(buildLightTile(dev));
    app.appendChild(tiles);
  }
  if (shutters.length) {
    app.appendChild(sectionHeading("🪟 シャッター"));
    for (const g of grps) app.appendChild(buildGroup(g, byName));
    // グループ非所属の shutter は従来カードで並べる（グループ所属は行で登録済み）。
    for (const dev of shutters) {
      if (!grouped.has(dev.name)) app.appendChild(buildCard(dev));
    }
  }
  // グラフが config に無ければセクションごと出さない。
  if (graphList.length) buildGraphSection(graphList);
  startPolling();
  fetchLightStatesOnce(devices);
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) pollOnce(); });

boot();
</script>
