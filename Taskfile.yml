# go-task タスク定義。即ビルド & 実行用。
#   task           一覧
#   task run       config.toml で起動（無ければ example から自動生成）
#   task build     リリースビルド（単一バイナリ）
version: "3"

vars:
  CONFIG: '{{.MANDO_CONFIG | default "config.toml"}}'
  BIN: target/release/mando
  # systemd 常駐（ラズパイ）用の配置先。
  BIN_DST: /usr/local/bin/mando
  CONFIG_DIR: /etc/mando
  UNIT: /etc/systemd/system/mando.service

tasks:
  default:
    desc: タスク一覧
    cmds:
      - task --list
    silent: true

  config:
    desc: config.toml が無ければ example からコピー（実 IP・EPC は要手動編集）
    status:
      - test -f {{.CONFIG}}
    cmds:
      - cp config.example.toml {{.CONFIG}}
      - 'echo "[task] {{.CONFIG}} を作成。実 IP・EPC を埋めること。"'

  run:
    desc: デバッグ起動（config 自動生成 → cargo run）
    deps: [config]
    env:
      MANDO_CONFIG: "{{.CONFIG}}"
      RUST_LOG: '{{.RUST_LOG | default "mando=debug"}}'
    cmds:
      - cargo run

  build:
    desc: リリースビルド（単一バイナリ、index.html 焼き込み済み）
    cmds:
      - cargo build --release
    sources:
      - src/**/*.rs
      - index.html
      - Cargo.toml
    generates:
      - "{{.BIN}}"

  start:
    desc: リリースバイナリで起動（build → 実行）
    deps: [build, config]
    env:
      MANDO_CONFIG: "{{.CONFIG}}"
      RUST_LOG: '{{.RUST_LOG | default "mando=info"}}'
    cmds:
      - ./{{.BIN}}

  test:
    desc: テスト
    cmds:
      - cargo test

  lint:
    desc: clippy（警告をエラー扱い）
    cmds:
      - cargo clippy -- -D warnings

  fmt:
    desc: フォーマット
    cmds:
      - cargo fmt

  check:
    desc: test + lint + fmt 確認（CI 相当）
    cmds:
      - cargo fmt --check
      - task: lint
      - task: test

  up:
    desc: Docker Compose で起動（host network）
    deps: [config]
    cmds:
      - docker compose up -d --build

  down:
    desc: Docker Compose 停止
    cmds:
      - docker compose down

  # ── systemd 常駐（ラズパイ）─────────────────────────────
  install:
    desc: systemd サービスとして常駐インストール（sudo 必要。Pi 上で実行）
    deps: [build]
    cmds:
      - sudo install -Dm755 {{.BIN}} {{.BIN_DST}}
      - sudo install -d {{.CONFIG_DIR}}
      # 実 config が無ければ example を雛形配置（実 IP・EPC は要編集）。
      - 'test -f {{.CONFIG_DIR}}/config.toml || sudo install -m644 config.example.toml {{.CONFIG_DIR}}/config.toml'
      # テンプレートを実値へ置換して unit を配置（User は実行ユーザ）。
      # __CARGO_BIN__ は実ユーザ home の ~/.cargo/bin（enl の cargo install 先）。
      - >-
        sed -e "s#__USER__#$(whoami)#"
        -e "s#__BIN__#{{.BIN_DST}}#"
        -e "s#__CONFIG__#{{.CONFIG_DIR}}/config.toml#"
        -e "s#__CARGO_BIN__#$(getent passwd $(whoami) | cut -d: -f6)/.cargo/bin#"
        deploy/mando.service | sudo tee {{.UNIT}} >/dev/null
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now mando
      - 'echo "[task] 常駐開始。{{.CONFIG_DIR}}/config.toml を実値に編集後: sudo systemctl restart mando"'

  uninstall:
    desc: systemd サービスを停止・削除（config は残す）
    cmds:
      - sudo systemctl disable --now mando || true
      - sudo rm -f {{.UNIT}} {{.BIN_DST}}
      - sudo systemctl daemon-reload
      - 'echo "[task] 削除完了。config は {{.CONFIG_DIR}} に残置（不要なら手動削除）"'

  reload:
    desc: 常駐サービスを再起動して config を反映（config 変更後）
    cmds:
      - sudo systemctl restart mando
      - systemctl status mando --no-pager --lines=0

  svc-status:
    desc: 常駐サービスの状態
    cmds:
      - systemctl status mando --no-pager

  logs:
    desc: 常駐サービスのログを追尾（journalctl）
    cmds:
      - journalctl -u mando -f --no-pager
